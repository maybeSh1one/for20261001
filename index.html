<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript 練習 </title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>

<main>
    
<form id="payment-form" novalidate>

  <label for="card-number">測試卡號</label>
  <input id="card-number" inputmode="numeric">
  <small id="card-error"></small>

  <label for="expiry">有效期限 MM/YY</label>
  <input id="expiry" placeholder="12/29">

  <label for="cvv">安全碼</label>
  <input id="cvv" inputmode="numeric">

  <label for="amount">金額</label>
  <input id="amount" type="number">

  <button>模擬付款</button>

</form>

</main>

</body>
</html>
