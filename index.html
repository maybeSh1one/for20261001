<html lang="zh-Hant">
<head>

  <title>我的第一個網站</title>

<body>
  <h1>你好，我是某某人</h1>
  <p>這是我的第一個 GitHub 專案。</p>
  <h1>百分比寬度看父元素</h1>
  <p>每一層的 50%，都以自己的父元素內容寬度為基準。</p>

  <div class="parent">
    父元素：頁面的 80%
    <div class="child">
      子元素：父元素的 50%
      <div class="grandchild">
        孫元素：子元素的 50%
      </div>
    </div>
</body>
