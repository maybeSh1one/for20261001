<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一個網站</title>
</head>
<body>
  <h1>你好，我是某某人</h1>
  <p>這是我的第一個 GitHub 專案。</p>
  <h1>百分比寬度看父元素</h1>
  <p>每一層的 50%，都以自己的父元素內容寬度為基準。</p>

 <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 32px;
      color: #17324d;
    }

    .parent {
      width: 80%;
      padding: 20px;
      background: #dceef5;
      border: 3px solid #286c86;
    }

    .child {
      width: 50%;
      margin-top: 20px;
      padding: 20px;
      background: #eaf7ff;
      border: 3px solid #5ea5be;
    }

    .grandchild {
      width: 50%;
      margin-top: 20px;
      padding: 20px;
      background: #eaf9ef;
      border: 3px solid #5aa66f;
    }

  </style>

  <div class="parent">
    父元素：頁面的 80%
    <div class="child">
      子元素：父元素的 50%
      <div class="grandchild">
        孫元素：子元素的 50%
      </div>
    </div>
  </div>
</body>
</html>
